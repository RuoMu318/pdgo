schema_version: "1.0"
message_type: REVIEW_DECISION | PLANNING_BLOCKER_OPINION
review_id: review-YYYYMMDD-NNN
message_id: review-YYYYMMDD-NNN
idempotency_key: review-YYYYMMDD-NNN
trace_id: trace-YYYYMMDD-NNN
plan_series_id: PROJECT-YYYYMMDD-NNN
plan_id: PROJECT-YYYYMMDD-NNN-topic-v1
plan_version: v1
task_id: T01
reviewer_session_id: review-session-id
observed_source_session_id: review-session-id
source_verified: true
# Echo the exact review-request envelope when the approved plan enables authorization_policy.required.
authorization_envelope:
  schema_version: "1.0"
  plan_series_id: PROJECT-YYYYMMDD-NNN
  plan_id: PROJECT-YYYYMMDD-NNN-topic-v1
  plan_version: v1
  approval_id: approval-YYYYMMDD-NNN
  boundary_digest: sha256-hex
  approval_boundary:
    approval_id: approval-YYYYMMDD-NNN
    approver: user
    decision: approved
    approved_scope: []
    acknowledged_risks: []
    conditions: []
  expires_at: "YYYY-MM-DDThh:mm:ssZ"
  attestation:
    proof_id: host-proof-id
    transport: trusted-host-adapter
    attested_at: "YYYY-MM-DDThh:mm:ssZ"
decision: accepted | revision-required | blocked | failed | continue | await-user
# accepted requires one passing criteria_result for every requested acceptance
# criterion, explicit passing evidence_checked entries for BossCoding v2, and no
# unresolved issue_results, defects, or required_changes.
criteria_results:
  - criterion: "result.txt exists with the approved content"
    result: pass
evidence_checked:
  - evidence: "result.txt content inspection"
    result: pass
issue_results:
  - issue_id: stable-issue-id
    status: open | resolved
    progress: none | partial | complete
    evidence: []
defects: []
new_risks: []
new_blockers: []
opinion: ""
requires_user: false
blocker_resolutions: []
required_changes: []
scope_change: false
material_change: false
requires_reapproval: false
next_action: unlock-next-task | dispatch | wait-for-user | stop
return_to: review-session-id

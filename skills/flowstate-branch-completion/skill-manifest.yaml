schema_version: "1.0"
skill_id: "flowstate-branch-completion"
display_name: "FlowState Branch Completion"
description: "Run completion checks, capture evidence, record deviations, and prepare a safe handoff without silently merging."
project_scope: ["flowstate"]
department: ["planning","execution","review"]
stage: ["discovery","design","implementation","validation"]
scenarios: ["an approved development branch is ready for handoff"]
positive_triggers: ["A task or branch reports implementation complete","A handoff or merge decision is requested"]
negative_triggers: ["Do not merge or push without authorization","Do not omit failing checks"]
boundaries: ["Do not merge or push without authorization","Do not omit failing checks"]
required_inputs: ["branch diff","test results","plan acceptance"]
expected_outputs: ["completion checklist","handoff report","residual risks"]
prerequisites: ["execution report","review criteria"]
side_effects: ["may run validation commands"]
risk_level: "medium"
priority: 50
category: "release"
subcategory: "branch-completion"
tags: ["release","branch-completion"]
